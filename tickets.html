<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tickets - Rifa Multicodigo 2026</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./src/css/global.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="header-inner" style="max-width: 1100px">
        <div class="brand-group">
          <span class="badge-fiis">TICKET</span>
          <span class="brand-title">Tickets de Rifa Multicode 2026</span>
        </div>
        <nav class="header-actions">
          <a href="/dashboard" class="nav-link-btn">Venta</a>
          <a href="/" class="nav-link-btn">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            </svg>
            <span class="nav-text">Inicio</span>
          </a>
        </nav>
      </div>
    </header>

    <main class="page-container" style="max-width: 1100px">
      <section class="internal-stats-bar">
        <div class="metric-card">
          <span class="metric-label">Total Boletos</span>
          <span id="metric-total-count" class="metric-num">--</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">Boletos Azules (S/ 3)</span>
          <span id="metric-blue-count" class="metric-num blue-txt">--</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">Boletos Rosas (S/ 5)</span>
          <span id="metric-pink-count" class="metric-num pink-txt">--</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">Recaudacion Estimada</span>
          <span id="metric-total-money" class="metric-num gold-txt">--</span>
        </div>
      </section>

      <section class="internal-table-card">
        <div class="table-toolbar">
          <div class="search-input-box">
            <svg
              class="search-icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input
              type="text"
              id="filter-input"
              placeholder="Filtrar por comprador, telefono, # de serie o vendedor..."
              class="filter-input"
            />
          </div>
          <button
            id="btn-refresh"
            class="btn-refresh-table"
            title="Refrescar lista"
          >
            Actualizar
          </button>
        </div>

        <div class="table-responsive-wrapper">
          <table class="data-table">
            <thead>
              <tr>
                <th># Serie</th>
                <th>Tipo</th>
                <th>Comprador</th>
                <th>Telefono WhatsApp</th>
                <th>Código / Vendedor</th>
                <th>Fecha</th>
              </tr>
            </thead>
            <tbody id="tickets-table-body">
              <tr>
                <td colspan="6" class="table-loading">Cargando registros...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script type="module" src="./src/js/tickets.js"></script>
  </body>
</html>
