<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Buscar Mis Boletos - Rifa Multicodigo FIIS</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/css/global.css" />
  </head>
  <body>
    <!-- Top Header -->
    <header class="app-header">
      <div class="header-inner">
        <a href="/" class="brand-group" title="Volver al inicio">
          <span class="badge-fiis">FIIS UNI</span>
          <span class="brand-title">Rifa Multicodigo</span>
        </a>
        <nav class="header-actions">
          <a href="/" class="nav-link-btn">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            </svg>
            <span class="nav-text">Inicio</span>
          </a>
        </nav>
      </div>
    </header>

    <main class="page-container">
      <section class="search-card">
        <header class="section-header">
          <h1 class="section-title">Consulta de Boletos</h1>
          <p class="section-subtitle">
            Ingresa el numero de WhatsApp con el que compraste tus boletos
          </p>
        </header>

        <form id="form-search-tickets" class="search-form">
          <div class="form-group">
            <label for="search-phone" class="form-label"
              >Numero de Celular</label
            >
            <div class="input-phone-wrapper">
              <span class="country-prefix">+51</span>
              <input
                type="tel"
                id="search-phone"
                class="form-input"
                placeholder="912 345 678"
                maxlength="11"
                required
                autocomplete="tel"
              />
            </div>
          </div>

          <button type="submit" id="btn-search" class="btn btn-primary">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            Consultar Mis Boletos
          </button>
        </form>
      </section>

      <div id="search-status" class="search-status" style="display: none"></div>

      <section
        id="results-container"
        class="results-container"
        style="display: none"
      >
        <div class="results-header-row">
          <h2 id="results-count" class="results-count-title">
            Boletos Encontrados
          </h2>
          <span class="results-hint">Sorteo en vivo: 29 Oct • 7:00 PM</span>
        </div>

        <div id="tickets-grid" class="tickets-grid">
        </div>
      </section>
    </main>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script type="module" src="./src/js/search.js"></script>
  </body>
</html>
