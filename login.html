<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Acceso Delegados - Rifa Multicodigo FIIS</title>

    <link
      rel="icon"
      type="image/jpeg"
      href="./assets/imgs/logo/raffle_logo.jpeg"
    />
    <link rel="apple-touch-icon" href="./assets/imgs/logo/raffle_logo.jpeg" />

    <meta property="og:title" content="Gran Rifa Multicódigo FIIS 2026" />
    <meta property="og:description" content="Inicia sesion como vendedor" />
    <meta
      property="og:image"
      content="https://rifa-multicode-2026-xi.vercel.app/assets/imgs/logo/raffle_logo.jpeg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="/assets/raffle_logo.ico" />
    <link rel="stylesheet" href="./src/css/global.css" />
  </head>
  <body class="auth-body">
    <header class="app-header">
      <div class="header-inner">
        <a href="/" class="brand-group">
          <img
            src="./assets/imgs/logo/raffle_logo_alt.jpeg"
            alt="Logo Rifa"
            class="brand-logo-img"
          />
          <div class="brand-text-col">
            <span class="badge-fiis">FIIS UNI</span>
            <span class="brand-title">Rifa Multicódigo</span>
          </div>
        </a>
        <a href="/" class="nav-link-btn">
          <svg
            class="icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          </svg>
          <span class="nav-text">Inicio</span>
        </a>
      </div>
    </header>

    <main class="auth-wrapper">
      <div class="auth-card">
        <div class="auth-header">
          <span class="auth-shield-badge">Portal Vendedores</span>
          <h1 class="auth-title">Ingreso de Vendedores</h1>
          <p class="auth-subtitle">
            Acceso exclusivo para las codigos 25-2, 26-1 y 26-2
          </p>
        </div>

        <form id="form-request-otp" class="auth-form">
          <div class="form-group">
            <label for="identifier" class="form-label"
              >Correo Institucional o Codigo UNI</label
            >
            <input
              type="text"
              id="identifier"
              class="form-input"
              required
              placeholder="ejemplo@uni.pe o 2025XXXX"
              autocomplete="username"
            />
          </div>
          <button type="submit" id="btn-request-otp" class="btn btn-primary">
            Solicitar Codigo OTP
          </button>
        </form>

        <form id="form-verify-otp" class="auth-form" style="display: none">
          <div class="form-group">
            <label for="otp" class="form-label"
              >Codigo de Seguridad (6 dígitos)</label
            >
            <input
              type="text"
              id="otp"
              class="form-input otp-input"
              required
              placeholder="123456"
              maxlength="6"
              inputmode="numeric"
              autocomplete="one-time-code"
            />
          </div>
          <button type="submit" id="btn-verify-otp" class="btn btn-blue">
            Verificar e Ingresar
          </button>
          <button
            type="button"
            id="btn-back-to-request"
            class="btn-text-action"
          >
            Cambiar correo o codigo
          </button>
        </form>

        <div
          id="auth-status"
          class="search-status"
          style="display: none; margin-top: 1rem"
        ></div>
      </div>
    </main>

    <script type="module" src="./src/js/auth.js"></script>
  </body>
</html>
